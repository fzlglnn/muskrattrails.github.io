  <title>Muskrat Trails Ramble</title>

  <main id="ramble-main">
    <div id="ramble-col-2">
      <div id="ramble-text-box">
        The Muskrat Ramble is a self-supported, multi-day bikepacking event. Beginning in downtown Columbia,

        <p>Sign up for the 2026 Ramble <a href="http://tiny.cc/n7ma101" target="_blank" rel="noopener noreferrer">here.</a></p>
      </div>
    </div>
    <br>
    <div id="ramble-map-section">
      <div id="ramble-flyer">
        <img src="./images/2026THERIDE.jpg" alt="Ride outline">
      </div>
    </div>
    <div id="flyer-section00">
      <div id="packinglist-flyer">
        <img src="./images/packinglist.jpg" alt="Packing list">
      </div>
    </div>
